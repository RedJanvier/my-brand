<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — RedJanvier</title>
  <meta name="description" content="Case study by Janvier Ntwali (RedJanvier) — the technical choices behind a production build." />
  <meta name="author" content="Janvier Ntwali Habiyaremye" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0e10" />
  <link rel="canonical" id="canonical" href="https://redjanvier.netlify.app/projects.html" />

  <link rel="icon" href="assets/favicon_io/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="assets/favicon_io/apple-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="RedJanvier" />
  <meta property="og:title" id="og-title" content="Project — RedJanvier" />
  <meta property="og:description" id="og-desc" content="A case study from Janvier Ntwali's portfolio." />
  <meta property="og:image" id="og-image" content="https://redjanvier.netlify.app/assets/img/janvier.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <main class="page-top">
    <div class="wrap">
      <div id="article-root"><p class="loading">Loading case study&hellip;</p></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    const boot = async () => {
      const { loadEntry, loadIndex, renderMarkdown, esc } = await import("./js/content.js");
      const root = document.getElementById("article-root");
      const slug = new URLSearchParams(location.search).get("slug");

      try {
        const { meta, body } = await loadEntry("projects", slug);
        document.title = `${meta.title} — RedJanvier`;

        // Per-project SEO: canonical, description, Open Graph
        const SITE = "https://redjanvier.netlify.app";
        const pageUrl = `${SITE}/project.html?slug=${encodeURIComponent(slug)}`;
        const desc = (meta.tagline || `${meta.title} — a case study from Janvier Ntwali's portfolio.`).slice(0, 300);
        const ogImg = meta.image ? `${SITE}/${meta.image}` : `${SITE}/assets/img/janvier.jpg`;
        const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
        set("#canonical", "href", pageUrl);
        set('meta[name="description"]', "content", desc);
        set("#og-title", "content", `${meta.title} — RedJanvier`);
        set("#og-desc", "content", desc);
        set("#og-image", "content", ogImg);
        let ogUrl = document.querySelector('meta[property="og:url"]');
        if (!ogUrl) { ogUrl = document.createElement("meta"); ogUrl.setAttribute("property", "og:url"); document.head.appendChild(ogUrl); }
        ogUrl.setAttribute("content", pageUrl);

        const facts = [
          ["Year", meta.year],
          ["Role", meta.role],
          ["Stack", meta.stack],
          ["Live", meta.live ? `<a href="${esc(meta.live)}" target="_blank" rel="noopener">${esc(meta.live.replace(/^https?:\/\//, ""))}</a>` : null],
          ["Source", meta.repo ? `<a href="${esc(meta.repo)}" target="_blank" rel="noopener">GitHub</a>` : null],
        ].filter(([, v]) => v)
         .map(([k, v]) => `<div><dt>${k}</dt><dd>${k === "Live" || k === "Source" ? v : esc(v)}</dd></div>`)
         .join("");

        root.innerHTML = `
          <div class="article-hero">
            <div class="crumbs"><a href="index.html">Home</a> <span class="label--muted">/</span> <a href="projects.html">Projects</a> <span class="label--muted">/</span> <span class="label label--muted">${esc(meta.title)}</span></div>
            <h1>${esc(meta.title)}</h1>
            <p class="tagline">${esc(meta.tagline || "")}</p>
            <dl class="facts">${facts}</dl>
          </div>
          ${meta.image ? `<figure class="case-shot"><img src="${esc(meta.image)}" alt="${esc(meta.title)} — live interface" loading="lazy" decoding="async" /><figcaption>${esc(meta.title)} — the live interface${meta.live ? ` at ${esc(meta.live.replace(/^https?:\/\//, "").replace(/\/$/, ""))}` : ""}.</figcaption></figure>` : ""}
          <div class="md-body">${renderMarkdown(body)}</div>
          <div class="article-nav">
            <a class="btn" href="projects.html">&larr; All projects</a>
            ${meta.live ? `<a class="btn btn--solid" href="${esc(meta.live)}" target="_blank" rel="noopener">Visit live site <span class="arrow">&rarr;</span></a>` : ""}
          </div>`;

        // prev / next could be added here from loadIndex("projects") if desired
      } catch (e) {
        root.innerHTML = `<div class="error-note">Case study not found. <a href="projects.html" style="color:var(--accent-bright)">Back to projects</a></div>`;
      }
    };
    if (window.marked) boot();
    else document.querySelector('script[src*="marked"]').addEventListener("load", boot);
  </script>
</body>
</html>
