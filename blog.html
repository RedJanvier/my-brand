<body>
  <main class="page-top">
    <div class="wrap">
      <div class="article-hero">
        <div class="crumbs"><a href="index.html">Home</a> <span class="label--muted">/</span> <a href="blog.html">Writing</a></div>
        <h1>Notes from production.</h1>
        <p class="tagline">Things I learned shipping real systems: event-driven architecture, CI/CD, frontend performance and the occasional hard-won mistake.</p>
      </div>

      <div class="post-list" id="post-list">
        <p class="loading">Loading posts&hellip;</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    const boot = async () => {
      const { loadCollection, esc } = await import("./js/content.js");
      try {
        const posts = (await loadCollection("blog"))
          .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
        document.getElementById("post-list").innerHTML = posts.map((p) => `
          <a class="post-item" href="post.html?slug=${esc(p.slug)}">
            <span class="date">${esc(p.date || "")}</span>
            <span><h3>${esc(p.title)}</h3><p class="excerpt">${esc(p.excerpt || "")}</p></span>
            <span class="go" aria-hidden="true">&rarr;</span>
          </a>`).join("");
      } catch {
        document.getElementById("post-list").innerHTML =
          '<p class="error-note">Posts unavailable. Serve over HTTP to load markdown content.</p>';
      }
    };
    if (window.marked) boot();
    else document.querySelector('script[src*="marked"]').addEventListener("load", boot);
  </script>
</body>
