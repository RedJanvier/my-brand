<body>
  <main class="page-top">
    <div class="wrap">
      <div class="article-hero">
        <div class="crumbs"><a href="index.html">Home</a> <span class="label--muted">/</span> <a href="projects.html">Projects</a></div>
        <h1>Work I'm proud to link to.</h1>
        <p class="tagline">Client platforms, products and open source. Every case study explains what was built, which technologies were chosen, and why.</p>
      </div>

      <div class="projects-grid" id="all-projects" style="margin-top:1rem">
        <p class="loading">Loading projects&hellip;</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    const boot = async () => {
      const { loadCollection, projectCard } = await import("./js/content.js");
      try {
        const projects = await loadCollection("projects");
        document.getElementById("all-projects").innerHTML =
          projects.map(projectCard).join("");
        document.querySelectorAll("#all-projects .reveal").forEach((el, i) => {
          setTimeout(() => el.classList.add("in"), 60 * i);
        });
      } catch {
        document.getElementById("all-projects").innerHTML =
          '<p class="error-note">Projects unavailable. Serve over HTTP to load markdown content.</p>';
      }
    };
    if (window.marked) boot();
    else document.querySelector('script[src*="marked"]').addEventListener("load", boot);
  </script>
</body>
