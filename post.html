<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post — RedJanvier</title>
  <meta name="description" content="Notes from production by Janvier Ntwali (RedJanvier)." />
  <meta name="author" content="Janvier Ntwali Habiyaremye" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0e10" />
  <link rel="canonical" id="canonical" href="https://redjanvier.netlify.app/blog.html" />

  <link rel="icon" href="assets/favicon_io/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="assets/favicon_io/apple-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="RedJanvier" />
  <meta property="og:title" id="og-title" content="Writing — RedJanvier" />
  <meta property="og:description" id="og-desc" content="Notes from production." />
  <meta property="og:image" content="https://redjanvier.netlify.app/assets/img/janvier.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://redjanvier.netlify.app/assets/img/janvier.jpg" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <main class="page-top">
    <div class="wrap">
      <div id="article-root"><p class="loading">Loading post&hellip;</p></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    const boot = async () => {
      const { loadEntry, renderMarkdown, esc } = await import("./js/content.js");
      const root = document.getElementById("article-root");
      const slug = new URLSearchParams(location.search).get("slug");
      try {
        const { meta, body } = await loadEntry("blog", slug);
        document.title = `${meta.title} — RedJanvier`;

        // Per-post SEO: canonical, description, Open Graph
        const SITE = "https://redjanvier.netlify.app";
        const pageUrl = `${SITE}/post.html?slug=${encodeURIComponent(slug)}`;
        const desc = (meta.excerpt || `${meta.title} — from Janvier Ntwali's writing.`).slice(0, 300);
        const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
        set("#canonical", "href", pageUrl);
        set('meta[name="description"]', "content", desc);
        set("#og-title", "content", `${meta.title} — RedJanvier`);
        set("#og-desc", "content", desc);
        let ogUrl = document.querySelector('meta[property="og:url"]');
        if (!ogUrl) { ogUrl = document.createElement("meta"); ogUrl.setAttribute("property", "og:url"); document.head.appendChild(ogUrl); }
        ogUrl.setAttribute("content", pageUrl);
        root.innerHTML = `
          <div class="article-hero">
            <div class="crumbs"><a href="index.html">Home</a> <span class="label--muted">/</span> <a href="blog.html">Writing</a></div>
            <h1>${esc(meta.title)}</h1>
            <p class="tagline">${esc(meta.excerpt || "")}</p>
            <dl class="facts">
              <div><dt>Published</dt><dd>${esc(meta.date || "")}</dd></div>
              ${meta.tags ? `<div><dt>Topics</dt><dd>${esc(meta.tags)}</dd></div>` : ""}
              <div><dt>Author</dt><dd>Janvier Ntwali</dd></div>
            </dl>
          </div>
          <div class="md-body">${renderMarkdown(body)}</div>
          <div class="article-nav">
            <a class="btn" href="blog.html">&larr; All posts</a>
          </div>`;
      } catch {
        root.innerHTML = '<div class="error-note">Post not found. <a href="blog.html" style="color:var(--accent-bright)">Back to writing</a></div>';
      }
    };
    if (window.marked) boot();
    else document.querySelector('script[src*="marked"]').addEventListener("load", boot);
  </script>
</body>
</html>
